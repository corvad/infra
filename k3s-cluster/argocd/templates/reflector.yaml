apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reflector
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: reflector
    server: https://kubernetes.default.svc
  project: reflector
  source:
    chart: reflector
    repoURL: https://emberstack.github.io/helm-charts
    targetRevision: 9.1.45
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true